# Lean-LaTeX Link Automation Configuration

# Default settings for the automation script
[DEFAULT]
lean_dir = lean
tex_file = tex/report.tex
backup_suffix = .bak

# Matching parameters
[MATCHING]
min_score_threshold = 0.5
max_candidates = 3
conflict_score_diff = 0.1

# Comment inclusion settings
[COMMENTS]
include_above = true
include_below = true
max_comment_lines = 10

# Validation settings
[VALIDATION]
check_file_exists = true
check_line_bounds = true
warn_empty_ranges = true

# Output settings
[OUTPUT]
verbose = false
show_progress = true
generate_reports = true